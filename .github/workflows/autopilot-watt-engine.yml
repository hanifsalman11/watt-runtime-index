name: Autonomous Wattage & Solar Generator Engine

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_appliance:
        description: 'Optional Appliance Name (e.g. Submersible Well Pump)'
        required: false
        default: ''
  repository_dispatch:
    types: [n8n_watt_trigger]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-watt-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_APPLIANCE: ${{ github.event.client_payload.appliance || github.event.inputs.custom_appliance || '' }}
        run: |
          python engine/watt_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_appliances.json
          if git diff --staged --quiet; then
            echo "No new appliance pages to commit."
          else
            git commit -m "chore(pseo): auto-publish new appliance wattage calculators"
            git push origin main
          fi
